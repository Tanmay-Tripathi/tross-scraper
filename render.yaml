# Render Blueprint — provisions the API with its Postgres and Redis, over HTTPS.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# New → Blueprint and point it at the repository. The only manual step is
# supplying the two LinkedIn cookies, which are marked sync:false below.

databases:
  - name: tross-scraper-db
    databaseName: tross_scraper
    user: tross
    plan: free

services:
  - type: keyvalue
    name: tross-scraper-cache
    plan: free
    # Reachable only from other services in this blueprint.
    ipAllowList: []

  - type: web
    name: tross-scraper-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /public/v1/health
    envVars:
      - key: CONFIG_FILE
        value: ./config/production.yml
      - key: APP_ENV
        value: prd
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: tross-scraper-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: tross-scraper-cache
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: tross-scraper-cache
          type: keyvalue
          property: port
      # Render's managed Key Value instances are plaintext inside the private
      # network, so TLS stays off here.
      - key: REDIS_TLS_ENABLED
        value: "false"
      # The LinkedIn session cookies. sync:false keeps them out of the repo —
      # Render prompts for them on first deploy and stores them encrypted.
      # See the README for how to copy them from a browser.
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: LINKEDIN_DAILY_BUDGET
        value: "200"
      - key: LINKEDIN_CACHE_TTL_MINUTES
        value: "360"

