server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    etag off;
    autoindex off;
    absolute_redirect off;
    port_in_redirect off;

    # Defense in depth: never serve dotfiles that leak into the build output.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Hashed build assets are content-addressed, so they can be cached forever.
    location ~* ^/assets/.*\.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html must never be cached, or a redeploy keeps serving stale
    # references to asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
