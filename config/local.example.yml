# Copy this file to config/local.yml and fill in the blanks.
# config/local.yml is gitignored — never commit real credentials.
#
# Every value supports ${VAR} expansion, so deployments can supply secrets
# through the environment instead of a file on disk.

ServerPort: 4201
AppName: "tross-scraper"
AppVersion: "0.1.0"
BaseUrl: "http://localhost:4201"
Environment: "local" # local | stg | uat | prd
LogLevel: "info"     # debug | info | warn | error

# OpenTelemetry OTLP/HTTP endpoint (host:port). Leave empty to disable tracing.
OtlpExporterUrl: ""

Redis:
  host: "localhost"
  port: 6379
  username: ""
  password: ""
  tls_enabled: false
  pool_size: 20

Database:
  master_database_dsn: "postgres://tross:tross@localhost:5432/tross_scraper?sslmode=disable"
  # Leave the slave DSN empty to reuse the master connection.
  slave_database_dsn: ""
  max_open_connections: 10
  max_idle_connections: 2
  skip_migrations: false

# Browser origins allowed to call this API. Empty disables CORS, which is the
# right default for a curl/server-to-server API.
Cors:
  allowed_origins: []

# LinkedIn session. Both values come from a browser you are logged into.
# See README for how to copy them. Use a throwaway account, not a personal one,
# and set that account to Private profile-viewing mode.
LinkedIn:
  li_at: ""
  # Paste WITHOUT the surrounding double quotes that DevTools shows.
  jsessionid: ""
  request_timeout_seconds: 20
  cache_ttl_minutes: 360
  # Hard ceiling on live scrapes per day. This is what protects the account
  # when a public endpoint gets hammered. 0 means unlimited — never deploy that.
  daily_scrape_budget: 200

# Which profile sections the API returns by default. A request may override
# any of these. Unknown names fail at startup rather than being ignored.
Sections:
  about: true
  contactInfo: true
  openTo: true
  experience: true
  education: true
  skills: true
  featured: true
  projects: true
  licensesAndCertifications: true
  courses: true
  recommendations: true
  volunteerExperience: true
  publications: true
  patents: true
  honorsAndAwards: true
  testScores: true
  languages: true
  organizations: true
  services: true
  careerBreaks: true
  causes: true
