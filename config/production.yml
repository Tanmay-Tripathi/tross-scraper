# Deployed configuration. Every secret is a ${VAR} reference resolved from the
# process environment at startup, so this file is safe to commit.
#
# Required environment variables:
#   DATABASE_URL  - Postgres connection string
#   REDIS_HOST    - Redis hostname
#   REDIS_PORT    - Redis port
#   REDIS_PASSWORD, REDIS_USERNAME, REDIS_TLS_ENABLED - optional
#   PORT          - HTTP port (Render and most PaaS hosts inject this)
#   CORS_ALLOWED_ORIGINS - optional, comma-separated browser origins; unset disables CORS
#   LINKEDIN_LI_AT, LINKEDIN_JSESSIONID - the scraper account's session cookies
#
# ${VAR:-default} supplies a fallback when VAR is unset or empty.

ServerPort: ${PORT:-4201}
AppName: "tross-scraper"
AppVersion: "${APP_VERSION:-0.1.0}"
BaseUrl: "${BASE_URL}"
Environment: "${APP_ENV:-prd}"
LogLevel: "${LOG_LEVEL:-info}"
OtlpExporterUrl: "${OTLP_EXPORTER_URL}"

Redis:
  host: "${REDIS_HOST}"
  port: ${REDIS_PORT:-6379}
  username: "${REDIS_USERNAME}"
  password: "${REDIS_PASSWORD}"
  tls_enabled: ${REDIS_TLS_ENABLED:-false}
  pool_size: 20

Database:
  master_database_dsn: "${DATABASE_URL}"
  slave_database_dsn: ""
  max_open_connections: 10
  max_idle_connections: 2
  skip_migrations: false

# Comma-separated list of browser origins, e.g.
Cors:
  allowed_origins: "${CORS_ALLOWED_ORIGINS}"

LinkedIn:
  li_at: "${LINKEDIN_LI_AT}"
  jsessionid: "${LINKEDIN_JSESSIONID}"
  request_timeout_seconds: ${LINKEDIN_TIMEOUT_SECONDS:-20}
  cache_ttl_minutes: ${LINKEDIN_CACHE_TTL_MINUTES:-360}
  daily_scrape_budget: ${LINKEDIN_DAILY_BUDGET:-200}
