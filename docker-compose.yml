# Local development stack: Redis and the API. The service keeps no relational
# state, so there is no database here.
#
#   docker compose up --build      # API plus Redis
#   docker compose up -d redis     # just Redis, then run the API with `make run`

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: local
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CONFIG_FILE: ./config/production.yml
      APP_ENV: local
      PORT: "4201"
      LOG_LEVEL: debug
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Browser origins allowed to call the API. Empty disables CORS entirely.
      CORS_ALLOWED_ORIGINS: ""
    ports:
      - "4201:4201"
