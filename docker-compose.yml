# Local development stack: Postgres, Redis and the API.
#
#   docker compose up --build             # API plus its dependencies
#   docker compose up -d postgres redis   # just the dependencies, run the API with `make run`

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tross
      POSTGRES_PASSWORD: tross
      POSTGRES_DB: tross_scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tross -d tross_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_FILE: ./config/production.yml
      APP_ENV: local
      PORT: "4201"
      BASE_URL: http://localhost:4201
      LOG_LEVEL: debug
      DATABASE_URL: postgres://tross:tross@postgres:5432/tross_scraper?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Browser origins allowed to call the API. Empty disables CORS entirely.
      CORS_ALLOWED_ORIGINS: ""
    ports:
      - "4201:4201"

volumes:
  postgres_data:
